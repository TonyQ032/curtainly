name: Ingest

on:
  schedule:
    # Daily at 11:00 UTC (3–4am Pacific). Also keeps the Supabase free-tier project active.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Optional source id to run alone'
        required: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          INGEST_USER_AGENT: CurtainlyBot/0.1 (+https://github.com/${{ github.repository }})
          INGEST_SOURCE_ID: ${{ inputs.source }}
